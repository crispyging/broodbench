name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests -q
      - run: node --check static/app.js && node tests/ui_contract.test.cjs
      - run: pip-audit -r requirements.txt --progress-spinner off
      - run: docker build --target test -t broodbench:test .
      - run: docker run --rm --network none broodbench:test
